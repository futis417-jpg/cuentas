name: TikTok_Bot_2026

on:
  workflow_dispatch: # Botón manual en Actions

jobs:
  ejecutar_bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar Librerias
        run: |
          pip install playwright playwright-stealth httpx opencv-python-headless numpy

      - name: Instalar Navegador
        run: |
          python -m playwright install chromium
          python -m playwright install-deps chromium

      - name: Correr Bot
        run: python bot.py

      - name: Entregar Resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cuentas_generadas
          path: cuentas.txt
