name: TikTok_Auto_Bot

on: 
  workflow_dispatch: # Botón manual
  push:
    branches: [ main ]

jobs:
  run_bot:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias de Python
        run: |
          pip install playwright playwright-stealth httpx opencv-python-headless numpy

      - name: Instalar Navegador y Dependencias del Sistema
        run: |
          # Esto instala Chromium y las librerías de Linux necesarias
          python -m playwright install chromium
          python -m playwright install-deps chromium

      - name: Ejecutar Bot
        run: python bot.py
        env:
          PYTHONUNBUFFERED: "1"

      - name: Entregar Cuentas
        if: always() # Aunque falle, intenta darnos el archivo
        uses: actions/upload-artifact@v4
        with:
          name: cuentas_tiktok
          path: cuentas.txt
