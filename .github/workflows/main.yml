name: TikTok_Creator

on:
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python Setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install playwright playwright-stealth httpx opencv-python-headless numpy

      - name: Install Browser
        run: |
          python -m playwright install chromium
          python -m playwright install-deps chromium

      - name: Run
        run: python bot.py

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mis_cuentas
          path: cuentas.txt
